<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome</title>
    <link href="./style.css" rel="stylesheet"/>
    <script src="./script.js"></script>
</head>
<body>
    <header>
    <h1>METRONOME</h1>
    </header>
    <div class="metronome">
    <div class="beat-visual">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="tempo-input">
        <form>
            <input id="bpm" type="number" min="1" max="300" step="1"/>
        </form>
        
    </div>
    <div id="start-button">
        <button onclick="beatSound()">START</button>
    </div>
    
    <div class="beats">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>10</button>
        <button>11</button>
        <button>12</button>
    </div>
    

    
    </div>
    


</body>
</html>
