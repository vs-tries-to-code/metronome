<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome</title>
    <link href="./style.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header>
    <h1>METRONOME</h1>
    </header>
    <div class="metronome">
    <div class="beat-visual">
        <div id="beat1" class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="tempo-input">
        <form>
            <input id="bpm" type="number" min="1" max="300" step="1"/>
        </form>
        
    </div>
    <div id="start-button">
        <button id="toggleBtn"><h2>START</h2></button>
    </div>
    
    <div class="beats">
        <button id="1">1</button>
        <button id="2">2</button>
        <button id="3">3</button>
        <button id="4">4</button>
        <button id="5">5</button>
        <button id="6">6</button>
        <button id="7">7</button>
        <button id="8">8</button>
        <button id="9">9</button>
        <button id="10">10</button>
        <button id="11">11</button>
        <button id="12">12</button>
    </div>
    </div>

</body>
<script src="./script.js" rel="script"></script>
</html>
