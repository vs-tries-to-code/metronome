<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome</title>
    <link href="./style.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header>
    <h1>METRONOME</h1>
    </header>
    <div class="metronome">
    <div class="beat-visual">
        <div id="beat1" class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="tempo-input">
            <div class="bpm-display-container">
                <div id="bpm-placeholder-text">
                    <p>Enter tempo in beats per minute</p>
                    <p class="small-subtext">Use the field below &ndash; or tap + / -</p>
                </div>
                <div id="bpm-active-display" style="display: none;">
                    <div id="large-bpm-display">120</div>
                    <div class="bpm-label">B P M</div>
                    <div id="tempo-marking">ALLEGRO</div>
                </div>
            </div>
            <div class="tempo-control">
                <button id="decrease">-</button>
                <input id="bpm" type="number" min="1" max="300" step="1" placeholder="e.g. 120"/>
                <button id="increase">+</button>
            </div>

       
        
    </div>
    <div id="start-button">
        <button id="toggleBtn"><h2> ▶ START</h2></button>
    </div>
    <div class="instruction">
        <h3>Select the number of beats per bar</h3>
        <h5>It is the number at the top of the time signature!</h5>
    </div>

    <div class="beats">
        <button><h4>1</h4></button>
        <button><h4>2</h4></button>
        <button><h4>3</h4></button>
        <button><h4>4</h4></button>
        <button><h4>5</h4></button>
        <button><h4>6</h4></button>
        <button><h4>7</h4></button>
        <button><h4>8</h4></button>
        <button><h4>9</h4></button>
        <button><h4>10</h4></button>
        <button><h4>11</h4></button>
        <button><h4>12</h4></button>
    </div>
    </div>

</body>
<script src="./script.js" rel="script"></script>
</html>
